[package]
name = "xtask"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish = false
description = "Repository tooling entry point: `cargo xtask <command>` (RUSTDOC-AND-XTASK.4)."

# Only crates the workspace already locks for the product (RUSTDOC-AND-XTASK.6, .13.b): the ported gates read JSON
# registries. The production-genericity DEPENDENCIES check refuses any other crate and every product crate.
[dependencies]
serde_json = { workspace = true }
