# SpecForge's project-owned Knowledge Map output contract.
# Bundle defaults remain project-agnostic; these values compose the local fact-card catalog.
: "${KM_FACT_CATALOG:=docs/knowledge/INDEX.md}"

# Fact-plane capacity, re-derived in ADR 0041, raised to nine title parts by ADR 0055
# (LIVE-DOCUMENT-PRESSURE-HEADROOM.43), and re-pinned by scripts/check_fact_card_catalog.pl.
# Every value stays inside the bundle's hard caps (1,024 facts / 10,240 keys / 64 shards / 2,097,152
# projection bytes); ADR 0055 moved the first two because a fact costs about nine keys, not eight.
#   facts  = 504 card slots + 76 answers-bearing decision records (77 decision files, LIVE-DOCUMENT-PRESSURE-HEADROOM.8.a)
#   keys   = 580 facts x 10 keys per fact, rounded to 512. Ten is the measured cost (8.73 keys per
#            fact on 2026-09-29, rising from 7.33 and 8.47) funded at the 90% rollover band, so the
#            declared facts are reachable; the funded count is re-derived on every run and reported by
#            scripts/check_knowledge_map_shard_contract.pl.
#   shards = the declared keys at the measured 147 keys per 300-line shard: ceil(6,144 / 147) = 42
#   lines  = KM_MAX_LANDING_LINES + KM_MAX_SHARDS x KM_MAX_SHARD_LINES
#   bytes  = KM_MAX_LANDING_BYTES + KM_MAX_SHARDS x KM_MAX_SHARD_BYTES
: "${KM_MAX_FACTS:=580}"
: "${KM_MAX_QUESTION_KEYS:=6144}"
: "${KM_MAX_SHARDS:=42}"
: "${KM_MAX_PROJECTION_LINES:=16224}"
: "${KM_MAX_PROJECTION_BYTES:=2072576}"
