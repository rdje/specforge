# SpecForge's project-owned Knowledge Map output contract.
# Bundle defaults remain project-agnostic; these values compose the local fact-card catalog.
: "${KM_FACT_CATALOG:=docs/knowledge/INDEX.md}"

# Fact-plane capacity, re-derived in ADR 0041, raised to seven title parts by
# LIVE-DOCUMENT-PRESSURE-HEADROOM.24a, and re-pinned by scripts/check_fact_card_catalog.pl.
# Every value stays inside the bundle's own hard caps (512 facts / 4,096 keys / 64 shards).
#   facts  = 392 card slots + 57 answers-bearing decision records
#   keys   = 449 facts x the 8-keys-per-fact ratio the bundle's hard caps declare, rounded to 512.
#            That lands on 4,096 exactly. The portable key cap is NOT the plane's binding
#            authority (LIVE-DOCUMENT-PRESSURE-HEADROOM.28 re-derived the claim this line used
#            to make): at the measured 2,767 keys over 327 facts (2026-09-17), a 4,096-key
#            budget funds 484 facts, and KM_MAX_FACTS 449 is inside that, so this repository's
#            own fact cap binds first. An eighth part declares 505 facts, above what it funds,
#            which is why seven parts is the last raise this bundle permits. The funded count
#            is derived on every run and reported by scripts/check_knowledge_map_shard_contract.pl,
#            so the figure above is re-measured rather than trusted.
#   lines  = KM_MAX_LANDING_LINES + KM_MAX_SHARDS x KM_MAX_SHARD_LINES
#   bytes  = KM_MAX_LANDING_BYTES + KM_MAX_SHARDS x KM_MAX_SHARD_BYTES
: "${KM_MAX_FACTS:=449}"
: "${KM_MAX_QUESTION_KEYS:=4096}"
: "${KM_MAX_PROJECTION_LINES:=12384}"
: "${KM_MAX_PROJECTION_BYTES:=1581056}"
