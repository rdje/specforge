name: CI

on:
  # Restored `2026-09-20` (`COMMIT-GATE-SINGLE-RUN.11`). `bc110c3d` made this workflow manual-only
  # "to conserve GitHub Actions minutes", on the condition "re-enable push/pull_request triggers
  # when hosted CI minutes are available again". The repository is now PUBLIC
  # (`gh api repos/rdje/specforge --jq .private` -> `false`), and hosted minutes are free for public
  # repositories, so the condition is met and the original triggers are restored exactly as
  # `bc110c3d^` had them. `workflow_dispatch` is KEPT so a run can still be forced without a push.
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # `/generated/` is gitignored, and of the corpus's 78 persisted documents only 21 were built from
  # a source tracked in `corpus/` — the other 57 record `path_origin: external_input`. The runner can
  # neither hold nor rebuild the corpus. Six doctrines are quantified over it, so this declares the
  # environment corpus-free and the gate reports them NOT DISCHARGED rather than failing on a subject
  # that cannot exist here, or passing over nothing (`COMMIT-GATE-SINGLE-RUN.14`).
  # It is a declaration, not a bypass: where a corpus IS present the flag changes nothing, and the
  # coverage it gives up is owned by `COMMIT-GATE-SINGLE-RUN.14a`.
  SPECFORGE_CORPUS_ABSENT: "1"

jobs:
  rust:
    name: Rust Checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Both `actions/checkout` defaults are wrong for this gate (`COMMIT-GATE-SINGLE-RUN.13`),
          # which is history-dependent and submodule-dependent. At the default `fetch-depth: 1`,
          # PUBLISHED-ASSERTIONS cannot resolve the revisions its published values are anchored to
          # ("revision ... does not resolve in this repository", 26 of its 27 violations), and
          # LIVE-DOC-SIZE and CLAIM-VERIFICATION cannot read boundary commits ("git exit 128").
          # At the default `submodules: false`, feedback-protocol cannot read the evidence it
          # requires under `subs/fsmgen`.
          # Bisected in a local clone: each is necessary, and together they are sufficient.
          fetch-depth: 0
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install mdBook
        run: cargo install --locked mdbook --version 0.5.2

      - name: Run CI suite
        run: ./scripts/run_ci.sh
