name: CI

on:
  # Restored `2026-09-20` (`COMMIT-GATE-SINGLE-RUN.11`). `bc110c3d` made this workflow manual-only
  # "to conserve GitHub Actions minutes", on the condition "re-enable push/pull_request triggers
  # when hosted CI minutes are available again". The repository is now PUBLIC
  # (`gh api repos/rdje/specforge --jq .private` -> `false`), and hosted minutes are free for public
  # repositories, so the condition is met and the original triggers are restored exactly as
  # `bc110c3d^` had them. `workflow_dispatch` is KEPT so a run can still be forced without a push.
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust Checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install mdBook
        run: cargo install --locked mdbook --version 0.5.2

      - name: Run CI suite
        run: ./scripts/run_ci.sh
