# knowledge_map.conf — Knowledge Map (KM) bundle defaults.
#
# This is the BUNDLE default. To override per project WITHOUT editing the bundle, drop a
# `.knowledge_map.conf` at your repo root with the same `:=` assignments; it is sourced
# first and therefore wins. Environment variables win over both.
#
# Every assignment uses ":=" (assign-only-if-unset) so precedence stays:
#     environment  >  repo-root .knowledge_map.conf  >  this bundle default

# Directories scanned for fact files (space-separated, repo-root-relative).
: "${KM_SCAN_DIRS:=docs/knowledge docs/decisions}"

# Where the derived map is written (repo-root-relative). This is your human-readable window.
: "${KM_OUTPUT:=KNOWLEDGE_MAP.md}"

# Title rendered at the top of the generated map.
: "${KM_TITLE:=Knowledge Map}"

# Bounded projection-set topology. Leave KM_FACT_CATALOG empty unless the adopting repository
# supplies a separately maintained id/title catalog.
: "${KM_SHARD_DIR:=docs/knowledge-map}"
: "${KM_SHARD_PREFIX:=questions-}"
: "${KM_FACT_CATALOG:=}"

# Independent input and output limits. A project may lower these in `.knowledge_map.conf`.
: "${KM_MAX_FACTS:=200}"
: "${KM_MAX_QUESTION_KEYS:=2048}"
: "${KM_MAX_QUESTION_BYTES:=2048}"
: "${KM_MAX_ID_BYTES:=96}"
: "${KM_MAX_PATH_BYTES:=192}"
: "${KM_MAX_LINK_LINE_BYTES:=512}"
: "${KM_WRAP_LINE_BYTES:=384}"
: "${KM_TARGET_SHARD_LINES:=300}"
: "${KM_TARGET_SHARD_BYTES:=40960}"
: "${KM_MAX_SHARD_LINES:=384}"
: "${KM_MAX_SHARD_BYTES:=49152}"
: "${KM_MAX_SHARDS:=32}"
: "${KM_MAX_PROJECTION_LINES:=4096}"
: "${KM_MAX_PROJECTION_BYTES:=393216}"
: "${KM_MAX_LANDING_LINES:=96}"
: "${KM_MAX_LANDING_BYTES:=8192}"
: "${KM_MAX_LANDING_LINE_BYTES:=256}"
