[workspace]
members = [
    "crates/specforge",
    "crates/specforge-core",
    "crates/specforge-conformance",
    "tools/production-genericity-graph",
    "xtask",
]
# `cargo run --manifest-path Cargo.toml -- <command>` is the documented form (README quick start, the
# book, the corpus-KB producer contract). It needs exactly one binary among the default members, and
# the enforcement tool is a second one, so it is a member but not a default one; so is `xtask`, the tooling
# entry point run as `cargo xtask` (RUSTDOC-AND-XTASK.4). Every gate that must
# cover it says `--workspace` or `-p` explicitly (SPEC-TO-INTENT-ALIGNMENT.6d.ii.e.v.ii.a).
default-members = [
    "crates/specforge",
    "crates/specforge-core",
    "crates/specforge-conformance",
]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.95"

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
syn = { version = "2", features = ["full", "visit", "visit-mut"] }
tempfile = "3"

# RUSTDOC-AND-XTASK.13.a — `cargo xtask` runs the dev profile, where the unoptimized SECTION-ANCHORS scan of the
# tree's 24.7 MB of Markdown took 0.88 s against the Perl script's 0.11 s. Optimizing the tooling crate alone (not
# the serde_json it shares with the product) brings it to 0.11 s and leaves every product crate's build as it was.
[profile.dev.package.xtask]
opt-level = 3
